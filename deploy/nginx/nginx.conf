# ==============================================================================
# Sai Ajantha Production Nginx Gateway Configuration
# Use this if deploying behind standard Nginx / Certbot SSL
# ==============================================================================

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Common Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 1. Customer & Dealer Storefront (sai-ajanta.com)
    server {
        listen 80;
        server_name sai-ajanta.com www.sai-ajanta.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://storefront:3000;
        }
    }

    # 2. Executive Admin Portal (admin.sai-ajanta.com)
    server {
        listen 80;
        server_name admin.sai-ajanta.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ADM-14: Forward API and authentication requests to Medusa backend
        location /auth/ {
            proxy_pass http://backend:9000/auth/;
        }

        location /admin/ {
            proxy_pass http://backend:9000/admin/;
        }

        location / {
            proxy_pass http://admin:80;
        }
    }

    # 3. Medusa 2.0 API & Media Engine (api.sai-ajanta.com)
    server {
        listen 80;
        server_name api.sai-ajanta.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://backend:9000;
        }
    }
}
