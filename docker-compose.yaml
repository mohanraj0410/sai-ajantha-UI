services:
  postgres:
    image: postgres:16
    container_name: sai-ajanta-monorepo-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      TZ: Asia/Kolkata
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: "7hippocampus"
      POSTGRES_DB: medusa
    ports:
      # Direct port reserved for migrations, administrative maintenance, and DDL
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: sai-ajanta-monorepo-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: medusa
      DB_PASSWORD: "7hippocampus"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medusa
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 250
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 50
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: 6432
    ports:
      # High-performance connection-pooled port for application queries
      - "127.0.0.1:${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: sai-ajanta-monorepo-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
